<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN Live Stream Player Mockup</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Include hls.js for HLS playback support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }
        
        /* Auto-hide classes controlled by JS */
        .is-idle {
            cursor: none;
        }
        .is-idle .player-ui-layer {
            opacity: 0 !important;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 md:p-8">

    <div class="w-full max-w-4xl flex flex-col gap-4">
        
        <header class="text-white">
            <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-2">
                <i class="ph-fill ph-monitor-play text-red-500"></i>
                Live Broadcast
            </h1>
            <p class="text-gray-400 text-sm mt-1">Live HLS Stream Integration</p>
        </header>

        <!-- The Video Player Wrapper -->
        <div id="video-container" class="relative w-full aspect-video bg-black rounded-lg shadow-2xl overflow-hidden select-none group">
            
            <!-- Real HTML5 Video Element -->
            <video id="video-element" class="absolute inset-0 w-full h-full object-cover z-0" playsinline muted autoplay></video>
            
            <!-- Top Title Bar -->
            <div id="top-bar" class="player-ui-layer absolute top-0 left-0 w-full p-4 bg-gradient-to-b from-black/80 via-black/40 to-transparent flex items-start justify-between opacity-0 transition-opacity duration-300 z-20">
                <div class="flex flex-col drop-shadow-md">
                    <span class="text-white font-semibold text-lg leading-tight">CNN Newsroom Live</span>
                    <span class="text-gray-300 text-sm">Akamai Test Stream</span>
                </div>
                <div class="flex gap-3">
                    <button class="text-white/80 hover:text-white transition-colors" title="Share">
                        <i class="ph ph-share-network text-2xl drop-shadow"></i>
                    </button>
                    <button class="text-white/80 hover:text-white transition-colors" title="Copy Link">
                        <i class="ph ph-link text-2xl drop-shadow"></i>
                    </button>
                </div>
            </div>

            <!-- Center Play Button Overlay -->
            <div id="center-play-overlay" class="absolute inset-0 flex items-center justify-center bg-black/20 hover:bg-black/10 transition-colors z-10">
                <button id="center-play-btn" class="bg-black/60 hover:bg-red-600 rounded-full w-20 h-20 md:w-24 md:h-24 flex items-center justify-center backdrop-blur-sm border border-white/10 transition-all duration-300 shadow-[0_0_30px_rgba(0,0,0,0.5)] transform hover:scale-105">
                    <i class="ph-fill ph-play text-white text-4xl md:text-5xl ml-2"></i>
                </button>
            </div>

            <!-- Bottom Controls Bar -->
            <div id="bottom-controls" class="player-ui-layer absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/90 via-black/70 to-transparent px-4 py-3 opacity-0 transition-opacity duration-300 z-20 flex flex-col gap-2">
                
                <!-- Timeline / Scrubber (Visual only for live stream) -->
                <div class="w-full flex items-center group/timeline h-4 cursor-pointer relative" title="Live Stream">
                    <div class="w-full h-1 bg-white/30 rounded relative transition-all group-hover/timeline:h-1.5 overflow-visible">
                        <div class="absolute top-0 left-0 h-full bg-red-600 w-full rounded"></div>
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-red-600 rounded-full shadow opacity-0 group-hover/timeline:opacity-100 transition-opacity"></div>
                    </div>
                </div>

                <!-- Controls Layout -->
                <div class="flex items-center justify-between text-white mt-1">
                    
                    <div class="flex items-center gap-4">
                        <button id="control-play-pause" class="hover:text-red-500 transition-colors flex items-center justify-center w-8" title="Play/Pause">
                            <i id="control-icon" class="ph-fill ph-play text-2xl"></i>
                        </button>
                        
                        <div class="flex items-center gap-2 group/volume">
                            <button id="mute-btn" class="hover:text-red-500 transition-colors flex items-center justify-center w-8" title="Mute/Unmute">
                                <i id="volume-icon" class="ph-fill ph-speaker-slash text-2xl text-red-500"></i>
                            </button>
                            <div class="w-0 overflow-hidden group-hover/volume:w-20 transition-all duration-300 ease-in-out flex items-center h-8">
                                <input type="range" id="volume-slider" min="0" max="100" value="0" class="w-full h-1">
                            </div>
                        </div>

                        <div class="flex items-center gap-2 ml-2 px-2 py-1 rounded bg-black/40 border border-white/10 cursor-help" title="Broadcasting Live">
                            <div class="w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse shadow-[0_0_8px_rgba(220,38,38,0.8)]"></div>
                            <span class="text-xs font-bold tracking-widest text-white">LIVE</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 md:gap-4">
                        <button class="hover:text-red-500 transition-colors flex items-center justify-center w-8 text-white/80 hover:text-white" title="Settings">
                            <i class="ph-fill ph-gear text-2xl"></i>
                        </button>
                        <button id="fullscreen-btn" class="hover:text-red-500 transition-colors flex items-center justify-center w-8 text-white/80 hover:text-white ml-2" title="Fullscreen">
                            <i id="fullscreen-icon" class="ph-fill ph-corners-out text-2xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('video-container');
            const video = document.getElementById('video-element');
            const topBar = document.getElementById('top-bar');
            const bottomControls = document.getElementById('bottom-controls');
            
            const centerOverlay = document.getElementById('center-play-overlay');
            const centerPlayBtn = document.getElementById('center-play-btn');
            const bottomPlayPauseBtn = document.getElementById('control-play-pause');
            const controlIcon = document.getElementById('control-icon');
            
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const fullscreenIcon = document.getElementById('fullscreen-icon');
            
            const muteBtn = document.getElementById('mute-btn');
            const volumeIcon = document.getElementById('volume-icon');
            const volumeSlider = document.getElementById('volume-slider');

            const videoSrc = 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8';
            let previousVolume = 0.8;

            // 1. Initialize HLS Stream
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    // Autoplay is attempted via the HTML attribute, but we can also trigger here.
                    video.play().catch(e => console.log("Autoplay prevented by browser:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Fallback for Safari (native HLS support)
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay prevented by browser:", e));
                });
            }

            // 2. Play / Pause Logic sync with video state
            const updatePlayStateUI = () => {
                if (!video.paused) {
                    centerOverlay.classList.add('opacity-0', 'pointer-events-none');
                    controlIcon.classList.replace('ph-play', 'ph-pause');
                } else {
                    centerOverlay.classList.remove('opacity-0', 'pointer-events-none');
                    controlIcon.classList.replace('ph-pause', 'ph-play');
                    showControls(); // Ensure controls are visible when paused
                }
            };

            video.addEventListener('play', updatePlayStateUI);
            video.addEventListener('pause', updatePlayStateUI);

            const togglePlay = () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            };

            centerPlayBtn.addEventListener('click', togglePlay);
            bottomPlayPauseBtn.addEventListener('click', togglePlay);
            video.addEventListener('click', togglePlay);

            // 3. Volume Logic
            const updateVolumeUI = () => {
                if (video.muted || video.volume === 0) {
                    volumeIcon.classList.replace('ph-speaker-high', 'ph-speaker-slash');
                    volumeIcon.classList.replace('ph-speaker-low', 'ph-speaker-slash');
                    volumeIcon.classList.add('text-red-500');
                    volumeSlider.value = 0;
                } else {
                    volumeIcon.classList.remove('text-red-500');
                    if (video.volume > 0.5) {
                        volumeIcon.classList.replace('ph-speaker-slash', 'ph-speaker-high');
                        volumeIcon.classList.replace('ph-speaker-low', 'ph-speaker-high');
                    } else {
                        volumeIcon.classList.replace('ph-speaker-slash', 'ph-speaker-low');
                        volumeIcon.classList.replace('ph-speaker-high', 'ph-speaker-low');
                    }
                    volumeSlider.value = video.volume * 100;
                }
            };

            volumeSlider.addEventListener('input', (e) => {
                const vol = e.target.value / 100;
                video.volume = vol;
                video.muted = vol === 0;
                if(vol > 0) previousVolume = vol;
                updateVolumeUI();
            });

            muteBtn.addEventListener('click', () => {
                if (video.muted || video.volume === 0) {
                    video.muted = false;
                    video.volume = previousVolume > 0 ? previousVolume : 0.8;
                } else {
                    previousVolume = video.volume;
                    video.muted = true;
                }
                updateVolumeUI();
            });
            
            // Sync initial state (Muted for autoplay policy)
            updateVolumeUI();

            // 4. Fullscreen Logic
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fullscreenIcon.classList.replace('ph-corners-out', 'ph-corners-in');
                } else {
                    fullscreenIcon.classList.replace('ph-corners-in', 'ph-corners-out');
                }
            });

            // 5. Idle Timer / Auto-hide Controls Logic
            let idleTimeout;
            
            const showControls = () => {
                topBar.classList.add('opacity-100');
                topBar.classList.remove('opacity-0');
                bottomControls.classList.add('opacity-100');
                bottomControls.classList.remove('opacity-0');
                container.classList.remove('is-idle');
            };

            const hideControls = () => {
                if (!video.paused) {
                    topBar.classList.remove('opacity-100');
                    topBar.classList.add('opacity-0');
                    bottomControls.classList.remove('opacity-100');
                    bottomControls.classList.add('opacity-0');
                    container.classList.add('is-idle');
                }
            };

            const resetIdleTimer = () => {
                showControls();
                clearTimeout(idleTimeout);
                if (!video.paused) {
                    idleTimeout = setTimeout(hideControls, 2500); // Hide after 2.5 seconds of inactivity
                }
            };

            // Event listeners for idle detection
            container.addEventListener('mousemove', resetIdleTimer);
            container.addEventListener('mousedown', resetIdleTimer);
            container.addEventListener('touchstart', resetIdleTimer);
            container.addEventListener('mouseleave', hideControls);
            container.addEventListener('mouseenter', showControls);
            
            // Ensure timer resets when video starts playing
            video.addEventListener('play', resetIdleTimer);
        });
    </script>
</body>
</html>
