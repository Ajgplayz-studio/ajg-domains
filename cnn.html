<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        .hide-cursor { cursor: none; }
        .fade-out { opacity: 0; pointer-events: none; }
        /* Hide native controls fully to prevent overlap */
        video::-webkit-media-controls { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen m-0 p-4 font-sans">

<div id="player-container" class="relative w-full max-w-5xl aspect-video bg-black overflow-hidden shadow-2xl rounded-lg group">
    
    <!-- Video Element -->
    <video id="video" class="w-full h-full object-contain" playsinline crossorigin="anonymous"></video>

    <!-- Top Bar -->
    <div id="top-bar" class="absolute top-0 left-0 w-full p-4 md:p-6 bg-gradient-to-b from-black/80 to-transparent transition-opacity duration-300 flex justify-between items-center z-10 text-white">
        <div class="flex items-center gap-3">
            <span class="bg-red-600 text-xs font-bold px-2 py-1 rounded tracking-wider uppercase flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>
                Live
            </span>
            <h1 class="text-sm md:text-lg font-semibold truncate drop-shadow-md">Live Broadcast Stream</h1>
        </div>
        <button class="hover:text-red-500 transition"><i class="ph ph-share-network text-2xl drop-shadow-md"></i></button>
    </div>

    <!-- Center Play Button (Initial State) -->
    <button id="center-play" class="absolute inset-0 m-auto w-16 h-16 md:w-20 md:h-20 bg-red-600/90 hover:bg-red-600 text-white rounded-full flex items-center justify-center transition-transform hover:scale-110 z-10 shadow-lg backdrop-blur-sm">
        <i class="ph-fill ph-play text-3xl md:text-4xl pl-1"></i>
    </button>

    <!-- Loading Spinner -->
    <div id="loading" class="absolute inset-0 m-auto w-12 h-12 border-4 border-white/30 border-t-red-600 rounded-full animate-spin z-0 hidden"></div>

    <!-- Bottom Controls -->
    <div id="bottom-bar" class="absolute bottom-0 left-0 w-full p-4 md:p-6 bg-gradient-to-t from-black/90 via-black/50 to-transparent transition-opacity duration-300 flex items-center gap-4 z-10 text-white">
        
        <button id="play-pause-btn" class="hover:text-red-500 transition">
            <i class="ph-fill ph-play text-2xl md:text-3xl drop-shadow-md" id="play-icon"></i>
        </button>

        <!-- Volume Container -->
        <div class="flex items-center gap-2 group/volume relative">
            <button id="mute-btn" class="hover:text-red-500 transition">
                <i class="ph-fill ph-speaker-high text-2xl drop-shadow-md" id="volume-icon"></i>
            </button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" 
                   class="w-0 group-hover/volume:w-20 md:group-hover/volume:w-24 transition-all duration-300 cursor-pointer accent-red-600 opacity-0 group-hover/volume:opacity-100 origin-left">
        </div>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <button class="hover:text-red-500 transition"><i class="ph ph-closed-captioning text-2xl md:text-3xl drop-shadow-md"></i></button>
        <button class="hover:text-red-500 transition"><i class="ph ph-gear text-2xl md:text-3xl drop-shadow-md"></i></button>
        <button id="fullscreen-btn" class="hover:text-red-500 transition"><i class="ph ph-corners-out text-2xl md:text-3xl drop-shadow-md" id="fullscreen-icon"></i></button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const playerContainer = document.getElementById('player-container');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const centerPlay = document.getElementById('center-play');
    const muteBtn = document.getElementById('mute-btn');
    const volumeIcon = document.getElementById('volume-icon');
    const volumeSlider = document.getElementById('volume-slider');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fullscreenIcon = document.getElementById('fullscreen-icon');
    const topBar = document.getElementById('top-bar');
    const bottomBar = document.getElementById('bottom-bar');
    const loading = document.getElementById('loading');

    // Reliable Apple HLS test stream
    const streamUrl = 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8';

    // Initialize HLS.js
    if (Hls.isSupported()) {
        const hls = new Hls({ debug: false });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
                console.error('HLS Error:', data);
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hls.startLoad();
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native support fallback (Safari)
        video.src = streamUrl;
    }

    // Playback Controls
    function togglePlay() {
        if (video.paused) {
            video.play().catch(err => console.warn("Playback prevented:", err));
        } else {
            video.pause();
        }
    }
    
    playPauseBtn.addEventListener('click', togglePlay);
    centerPlay.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    video.addEventListener('play', () => {
        playIcon.classList.replace('ph-play', 'ph-pause');
        centerPlay.classList.add('hidden');
    });

    video.addEventListener('pause', () => {
        playIcon.classList.replace('ph-pause', 'ph-play');
        centerPlay.classList.remove('hidden');
    });

    video.addEventListener('waiting', () => loading.classList.remove('hidden'));
    video.addEventListener('playing', () => loading.classList.add('hidden'));

    // Volume Controls
    muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        updateVolumeUI();
    });

    volumeSlider.addEventListener('input', (e) => {
        video.volume = e.target.value;
        video.muted = (video.volume === 0);
        updateVolumeUI();
    });

    function updateVolumeUI() {
        if (video.muted || video.volume === 0) {
            volumeIcon.className = 'ph-fill ph-speaker-x text-2xl md:text-3xl drop-shadow-md';
            volumeSlider.value = 0;
        } else if (video.volume < 0.5) {
            volumeIcon.className = 'ph-fill ph-speaker-low text-2xl md:text-3xl drop-shadow-md';
            volumeSlider.value = video.volume;
        } else {
            volumeIcon.className = 'ph-fill ph-speaker-high text-2xl md:text-3xl drop-shadow-md';
            volumeSlider.value = video.volume;
        }
    }

    // Fullscreen Controls
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            playerContainer.requestFullscreen().catch(err => console.error(err));
        } else {
            document.exitFullscreen();
        }
    });

    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenIcon.classList.replace('ph-corners-out', 'ph-corners-in');
        } else {
            fullscreenIcon.classList.replace('ph-corners-in', 'ph-corners-out');
        }
    });

    // Auto-hide UI on idle
    let idleTimeout;
    function resetIdleTimer() {
        clearTimeout(idleTimeout);
        topBar.classList.remove('fade-out');
        bottomBar.classList.remove('fade-out');
        playerContainer.classList.remove('hide-cursor');
        
        if (!video.paused) {
            idleTimeout = setTimeout(() => {
                topBar.classList.add('fade-out');
                bottomBar.classList.add('fade-out');
                playerContainer.classList.add('hide-cursor');
            }, 2500);
        }
    }

    playerContainer.addEventListener('mousemove', resetIdleTimer);
    playerContainer.addEventListener('mouseleave', () => {
        if (!video.paused) {
            topBar.classList.add('fade-out');
            bottomBar.classList.add('fade-out');
        }
    });
    
    video.addEventListener('play', resetIdleTimer);
    video.addEventListener('pause', () => {
        clearTimeout(idleTimeout);
        topBar.classList.remove('fade-out');
        bottomBar.classList.remove('fade-out');
        playerContainer.classList.remove('hide-cursor');
    });
</script>
</body>
</html>
