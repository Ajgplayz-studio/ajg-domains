<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ajg-drive - Cloud Storage</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex overflow-hidden">

    <!-- APP DASHBOARD CONTAINER -->
    <div id="appContainer" class="flex h-full w-full">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col p-3">
            <div class="flex items-center gap-3 px-3 py-2 mb-3">
                <span class="material-icons-outlined text-3xl text-blue-600">cloud</span>
                <h1 class="text-xl font-medium text-gray-600">ajg-drive</h1>
            </div>
            
            <div class="px-1 mb-4">
                <label class="flex items-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 shadow-sm hover:shadow rounded-full px-6 py-3 text-sm font-medium cursor-pointer transition">
                    <span class="material-icons-outlined text-blue-600">add</span>
                    <span>New Upload</span>
                    <input type="file" id="fileInput" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>

            <ul class="flex flex-col gap-1 flex-grow">
                <li><a href="#" class="flex items-center gap-4 px-4 py-2.5 rounded-r-full text-sm font-medium bg-blue-50 text-blue-600"><span class="material-icons-outlined">folder</span>My Drive</a></li>
                <li><a href="#" class="flex items-center gap-4 px-4 py-2.5 rounded-r-full text-sm font-medium text-gray-600 hover:bg-gray-50"><span class="material-icons-outlined">devices</span>Computers</a></li>
                <li><a href="#" class="flex items-center gap-4 px-4 py-2.5 rounded-r-full text-sm font-medium text-gray-600 hover:bg-gray-50"><span class="material-icons-outlined">people</span>Shared with me</a></li>
                <li><a href="#" class="flex items-center gap-4 px-4 py-2.5 rounded-r-full text-sm font-medium text-gray-600 hover:bg-gray-50"><span class="material-icons-outlined">schedule</span>Recent</a></li>
                <li><a href="#" class="flex items-center gap-4 px-4 py-2.5 rounded-r-full text-sm font-medium text-gray-600 hover:bg-gray-50"><span class="material-icons-outlined">star</span>Starred</a></li>
                <li><a href="#" class="flex items-center gap-4 px-4 py-2.5 rounded-r-full text-sm font-medium text-gray-600 hover:bg-gray-50"><span class="material-icons-outlined">delete</span>Trash</a></li>
            </ul>
        </aside>

        <!-- MAIN WINDOW -->
        <main class="flex-grow flex flex-col bg-gray-50 rounded-l-2xl border border-gray-200 overflow-hidden m-2 ml-0">
            <header class="flex items-center justify-between px-6 bg-white border-b border-gray-200 h-16">
                <div class="flex items-center bg-gray-100 rounded-lg px-4 py-2 w-1/2 max-w-2xl focus-within:bg-white focus-within:shadow border border-transparent focus-within:border-gray-200 transition">
                    <span class="material-icons-outlined text-gray-500">search</span>
                    <input type="text" id="searchInput" placeholder="Search in ajg-drive" onkeyup="filterFiles()" class="border-none outline-none bg-transparent w-full ml-3 text-sm">
                </div>
                <div class="flex items-center gap-3">
                    <span class="material-icons-outlined text-gray-600 cursor-pointer">settings</span>
                    <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-medium text-sm">AJ</div>
                </div>
            </header>

            <div class="flex-grow bg-white p-6 overflow-y-auto">
                <div class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-4">Folders</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-8" id="folderGrid"></div>

                <div class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-4">Files</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="fileGrid"></div>
            </div>
        </main>
    </div>

    <!-- PUBLIC DOWNLOAD PORTAL (Initially Hidden) -->
    <div id="downloadPortal" class="hidden fixed inset-0 bg-gray-100 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 max-w-md w-full p-8 text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="material-icons-outlined text-3xl">cloud_download</span>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-1" id="portalFileName">Filename.ext</h2>
            <p class="text-sm text-gray-500 mb-6" id="portalFileSize">0 KB</p>
            <button onclick="downloadSharedFile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl shadow transition mb-3">
                Download File
            </button>
            <a href="?" class="text-xs text-gray-500 hover:underline">Go to ajg-drive Home</a>
        </div>
    </div>

    <!-- SHARE LINK MODAL -->
    <div class="modal hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center" id="shareModal">
        <div class="bg-white p-6 rounded-xl shadow-xl w-[420px]">
            <h3 class="text-lg font-medium text-gray-900 mb-2">Public Share Link</h3>
            <p class="text-xs text-gray-500 mb-3">Copy this link or use TinyURL to make it shorter:</p>
            
            <div class="flex gap-2 mb-3">
                <input type="text" id="shareLinkInput" readonly class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-xs text-gray-600 outline-none select-all">
                <button onclick="copyShareLink()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap">Copy</button>
            </div>

            <div class="flex items-center justify-between mb-4">
                <button onclick="shortenWithTinyURL()" id="tinyBtn" class="text-xs text-blue-600 hover:underline font-medium flex items-center gap-1">
                    <span class="material-icons-outlined text-sm">link</span> Shorten with TinyURL
                </button>
                <span id="tinyStatus" class="text-[10px] text-gray-400"></span>
            </div>

            <div class="flex justify-end">
                <button onclick="closeShareModal()" class="border border-gray-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50">Close</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="alertModal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full text-center shadow-2xl border border-gray-100">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <span class="material-icons-outlined text-2xl">info</span>
            </div>
            <p id="alertMessage" class="text-sm text-gray-700 mb-5 font-medium"></p>
            <button onclick="closeAlert()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium w-full transition">OK</button>
        </div>
    </div>

    <script>
        let folders = JSON.parse(localStorage.getItem('ajg_folders')) || [
            { id: 1, name: "Project Documents" },
            { id: 2, name: "Media & Assets" }
        ];

        let files = JSON.parse(localStorage.getItem('ajg_files')) || [];
        let activeDownloadData = null;

        function showAlert(msg) {
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('alertModal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alertModal').classList.add('hidden');
        }

        function saveData() {
            localStorage.setItem('ajg_folders', JSON.stringify(folders));
            localStorage.setItem('ajg_files', JSON.stringify(files));
        }

        function render() {
            const folderGrid = document.getElementById('folderGrid');
            folderGrid.innerHTML = folders.map(f => `
                <div class="border border-gray-200 rounded-xl p-3 flex items-center gap-3 bg-white hover:bg-gray-50 hover:shadow-sm cursor-pointer transition">
                    <span class="material-icons-outlined text-gray-500">folder</span>
                    <span class="text-sm font-medium text-gray-800 truncate">${f.name}</span>
                </div>
            `).join('');

            const fileGrid = document.getElementById('fileGrid');
            if (files.length === 0) {
                fileGrid.innerHTML = `<p class="text-xs text-gray-400 col-span-full">No uploaded files yet. Click "New Upload" to add files.</p>`;
                return;
            }

            fileGrid.innerHTML = files.map(file => `
                <div class="border border-gray-200 rounded-xl overflow-hidden bg-white hover:border-blue-400 hover:shadow transition group flex flex-col">
                    <div class="h-28 bg-gray-50 flex items-center justify-center border-b border-gray-100 relative">
                        <span class="material-icons-outlined text-4xl text-gray-400">${getFileIcon(file.type)}</span>
                    </div>
                    <div class="p-3 flex items-center justify-between">
                        <div class="truncate mr-2">
                            <h4 class="text-xs font-medium text-gray-800 truncate">${file.name}</h4>
                            <p class="text-[10px] text-gray-400">${file.size}</p>
                        </div>
                        <button onclick="openShareModal('${file.id}')" title="Get Public Link" class="text-gray-400 hover:text-blue-600 transition">
                            <span class="material-icons-outlined text-lg">link</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getFileIcon(type) {
            if (type && type.includes('image')) return 'image';
            if (type && type.includes('pdf')) return 'picture_as_pdf';
            return 'insert_drive_file';
        }

        function handleFileUpload(event) {
            const uploadedFile = event.target.files[0];
            if (!uploadedFile) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const newFile = {
                    id: 'f_' + Math.random().toString(36).substr(2, 9),
                    name: uploadedFile.name,
                    type: uploadedFile.type,
                    size: (uploadedFile.size / 1024 > 1024) ? (uploadedFile.size / (1024*1024)).toFixed(1) + ' MB' : (uploadedFile.size / 1024).toFixed(1) + ' KB',
                    data: e.target.result
                };
                files.push(newFile);
                saveData();
                render();
                showAlert("File uploaded successfully!");
            };
            reader.readAsDataURL(uploadedFile);
            event.target.value = '';
        }

        function openShareModal(fileId) {
            const file = files.find(f => f.id == fileId);
            if (!file) return;

            // Store file temporarily in localStorage under a shared registry so any visitor can access it by ID
            let sharedRegistry = JSON.parse(localStorage.getItem('ajg_shared_files')) || {};
            sharedRegistry[file.id] = { name: file.name, size: file.size, data: file.data };
            localStorage.setItem('ajg_shared_files', JSON.stringify(sharedRegistry));

            // Generate clean short hash link
            const cleanUrl = window.location.origin + window.location.pathname + '#shared=' + file.id;
            
            document.getElementById('shareLinkInput').value = cleanUrl;
            document.getElementById('tinyStatus').innerText = '';
            document.getElementById('shareModal').classList.remove('hidden');
        }

        async function shortenWithTinyURL() {
            const inputField = document.getElementById('shareLinkInput');
            const statusLabel = document.getElementById('tinyStatus');
            const originalUrl = inputField.value;

            statusLabel.innerText = "Shortening...";
            try {
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(originalUrl)}`);
                if (response.ok) {
                    const shortUrl = await response.text();
                    inputField.value = shortUrl;
                    statusLabel.innerText = "Done!";
                } else {
                    statusLabel.innerText = "Failed (using standard link)";
                }
            } catch (err) {
                statusLabel.innerText = "CORS restricted. Standard link used.";
            }
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
        }

        function copyShareLink() {
            const input = document.getElementById('shareLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            showAlert("Share link copied to clipboard!");
            closeShareModal();
        }

        function downloadSharedFile() {
            if (!activeDownloadData) return;
            const a = document.createElement('a');
            a.href = activeDownloadData.data;
            a.download = activeDownloadData.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function checkPublicRoute() {
            const hash = window.location.hash;
            if (hash.startsWith('#shared=')) {
                const fileId = hash.replace('#shared=', '');
                
                // Check local registry or main files
                let sharedRegistry = JSON.parse(localStorage.getItem('ajg_shared_files')) || {};
                let fileObj = sharedRegistry[fileId] || files.find(f => f.id == fileId);

                if (fileObj) {
                    activeDownloadData = fileObj;
                    document.getElementById('portalFileName').innerText = fileObj.name;
                    document.getElementById('portalFileSize').innerText = fileObj.size;
                    
                    document.getElementById('appContainer').classList.add('hidden');
                    document.getElementById('downloadPortal').classList.remove('hidden');
                } else {
                    showAlert("File not found or link has expired.");
                }
            }
        }

        function filterFiles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const fileCards = document.querySelectorAll('#fileGrid > div');
            files.forEach((file, index) => {
                if (fileCards[index]) {
                    fileCards[index].style.display = file.name.toLowerCase().includes(query) ? 'flex' : 'none';
                }
            });
        }

        window.onload = function() {
            checkPublicRoute();
            render();
        };
    </script>
</body>
</html>
