<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJG-Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom Scrollbar for chat */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #2d3748; }
    ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #718096; }
    body { background-color: #1a202c; color: white; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-emerald-500 selection:text-white">

  <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-95">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-96 max-w-full text-center border border-gray-700">
      <h1 class="text-3xl font-bold text-emerald-500 mb-2">AJG-Connect</h1>
      <p id="authSubtitle" class="text-gray-400 mb-6">Log in to join your communities</p>
      
      <!-- The form submits via the window.handleAuthSubmit function -->
      <form id="authForm" onsubmit="window.handleAuthSubmit(event)">
        <input type="text" id="authUsername" placeholder="Username" class="w-full bg-gray-900 text-white border border-gray-700 rounded p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
        <input type="password" id="authPassword" placeholder="Password" class="w-full bg-gray-900 text-white border border-gray-700 rounded p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
        
        <div id="authError" class="hidden bg-red-500 bg-opacity-20 border border-red-500 text-red-400 p-3 rounded mb-4 text-sm font-semibold"></div>
        
        <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded transition-colors shadow-lg">
          Log In
        </button>
      </form>
      
      <div class="mt-6 text-sm text-gray-400">
        <span id="authToggleText">Need an account?</span>
        <!-- Button toggle works natively -->
        <button type="button" id="authToggleBtn" onclick="window.toggleAuthMode()" class="text-emerald-400 hover:text-emerald-300 font-bold hover:underline ml-1">Register</button>
      </div>
    </div>
  </div>

  <div id="appContainer" class="hidden w-full h-full flex">
    
    <!-- Sidebar - Navigation -->
    <div class="w-16 bg-gray-900 flex flex-col items-center py-4 space-y-4 flex-shrink-0 z-20 border-r border-gray-800">
      <button class="group w-12 h-12 rounded-3xl bg-indigo-500 flex items-center justify-center text-white shadow">
        <i class="fa-solid fa-message text-lg"></i>
      </button>
      <div class="w-8 h-1 bg-gray-700 rounded"></div>
      
      <!-- Admin Button for Ajgplayz -->
      <button onclick="window.showAdminPanel()" id="adminBtn" class="hidden group w-12 h-12 rounded-3xl hover:rounded-2xl bg-gray-800 hover:bg-red-500 transition-all flex items-center justify-center text-gray-300 hover:text-white shadow">
        <i class="fa-solid fa-shield-halved text-lg"></i>
      </button>
    </div>

    <!-- Sidebar - Direct Messages List & Search -->
    <div class="w-64 bg-gray-800 flex flex-col flex-shrink-0 border-r border-gray-700 z-10">
      <!-- Search Header -->
      <div class="h-16 flex flex-col justify-center px-4 border-b border-gray-900 shadow-sm shrink-0">
        <h2 class="font-bold text-gray-100 mb-1">Direct Messages</h2>
      </div>
      
      <!-- Live Search Bar -->
      <div class="p-3 bg-gray-800 border-b border-gray-700">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
          <input type="text" id="userSearchInput" oninput="window.handleUserSearch()" placeholder="Search users..." class="w-full bg-gray-900 text-sm text-gray-200 rounded-md pl-9 pr-3 py-2 focus:outline-none focus:ring-1 focus:ring-emerald-500 placeholder-gray-500">
        </div>
      </div>
      
      <!-- Populated User List -->
      <div id="usersList" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Javascript fills this -->
      </div>
      
      <!-- Current User Profile Footer -->
      <div class="h-14 bg-gray-900 flex items-center px-3 mt-auto shrink-0 border-t border-gray-700 shadow-inner">
        <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center mr-2 font-bold select-none text-sm text-white shadow-sm" id="currentUserInitial"></div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-sm truncate text-gray-200" id="currentUsernameDisplay"></div>
        </div>
        <button onclick="window.logout()" class="text-gray-400 hover:text-red-400 p-2 transition-colors" title="Log Out">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>

    <!-- Main Chat Content Area -->
    <div class="flex-1 bg-gray-700 flex flex-col relative min-w-0">
      <!-- Header -->
      <div class="h-16 flex items-center px-6 border-b border-gray-800 shadow-sm shrink-0 bg-gray-700 z-10">
        <i class="fa-solid fa-at text-gray-400 mr-2 text-xl hidden" id="chatHeaderIcon"></i>
        <h2 id="chatHeaderTitle" class="font-bold text-xl text-gray-100">Welcome to AJG-Connect</h2>
      </div>

      <!-- Messages Stream -->
      <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4">
        <div class="flex flex-col items-center justify-center h-full text-gray-400">
          <div class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center mb-4">
             <i class="fa-solid fa-message text-2xl text-gray-600"></i>
          </div>
          <p>Search or select a user from the sidebar to start a conversation.</p>
        </div>
      </div>

      <!-- Message Composer -->
      <div class="p-4 bg-gray-700 shrink-0 border-t border-gray-600">
        <form id="messageForm" onsubmit="window.handleSendMessage(event)" class="relative hidden">
          <input type="text" id="messageInput" placeholder="Message..." class="w-full bg-gray-600 text-white rounded-lg pl-4 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-inner" autocomplete="off">
          <button type="submit" class="absolute right-2 top-2 w-8 h-8 rounded flex items-center justify-center text-gray-300 hover:text-emerald-400 hover:bg-gray-500 transition-colors">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>
    
    <div id="adminPanel" class="hidden absolute inset-0 bg-gray-900 bg-opacity-95 z-30 flex items-center justify-center backdrop-blur-sm p-8">
      <div class="bg-gray-800 w-full max-w-4xl h-full max-h-[80vh] rounded-lg shadow-2xl flex flex-col border border-gray-700">
          <div class="h-16 flex items-center px-6 border-b border-gray-700 shadow-sm shrink-0 justify-between bg-gray-900 rounded-t-lg">
            <h2 class="font-bold text-xl text-red-500"><i class="fa-solid fa-shield-halved mr-2"></i>Moderator Dashboard - Global DMs</h2>
            <button onclick="window.closeAdminPanel()" class="text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-2xl"></i></button>
          </div>
          <div class="flex-1 p-6 overflow-y-auto space-y-4" id="adminDmList">
            <!-- Dynamic Admin Content -->
          </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc, onSnapshot, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'ajg-connect-v2';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    
    let db = null;
    let auth = null;
    let isOfflineMode = false;
    
    // Attempt connection
    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
      } catch(e) {
        console.error("Firebase init fallback to local:", e);
        isOfflineMode = true;
      }
    } else {
      isOfflineMode = true;
    }

    // App State
    let isRegisterMode = false;
    window.currentUser = null;
    let allUsers = [];
    let currentChatUserId = null;
    let messagesUnsubscribe = null;
    let usersUnsubscribe = null;

    window.toggleAuthMode = function() {
      isRegisterMode = !isRegisterMode;
      const btn = document.getElementById('authSubmitBtn');
      const toggleText = document.getElementById('authToggleText');
      const toggleBtn = document.getElementById('authToggleBtn');
      const subtitle = document.getElementById('authSubtitle');
      
      if (isRegisterMode) {
        btn.innerText = 'Register Account';
        toggleText.innerText = 'Already have an account?';
        toggleBtn.innerText = 'Log In';
        subtitle.innerText = 'Create a new account to join the network';
      } else {
        btn.innerText = 'Log In';
        toggleText.innerText = 'Need an account?';
        toggleBtn.innerText = 'Register';
        subtitle.innerText = 'Log in to join your communities';
      }
    };

    window.handleAuthSubmit = async function(e) {
      e.preventDefault();
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const errorDiv = document.getElementById('authError');
      const submitBtn = document.getElementById('authSubmitBtn');
      
      if (!username || !password) return;
      
      errorDiv.classList.add('hidden');
      submitBtn.innerText = 'Connecting...';
      submitBtn.disabled = true;
      
      try {
        let users = [];
        
        // Handle database routing
        if (!isOfflineMode) {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            if (!auth.currentUser) throw new Error("Could not connect to database security layer.");

            // Fetch list of users to check duplicates
            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
            const snapshot = await getDocs(usersRef);
            snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
        } else {
            users = JSON.parse(localStorage.getItem('ajg_users') || '[]');
        }

        let foundUser = users.find(u => u.username.toLowerCase() === username.toLowerCase());
        
        if (isRegisterMode) {
            // Register flow
            if (foundUser) throw new Error("Username already taken! Choose another.");
            
            const newUser = { username, password, createdAt: Date.now() };
            if (!isOfflineMode) {
               // Push to Firestore Cloud
               const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'users'), newUser);
               window.currentUser = { id: docRef.id, ...newUser };
            } else {
               // Push to LocalStorage
               newUser.id = 'user_' + Date.now();
               users.push(newUser);
               localStorage.setItem('ajg_users', JSON.stringify(users));
               window.currentUser = newUser;
            }
        } else {
            // Login flow
            if (!foundUser || foundUser.password !== password) throw new Error("Invalid username or password.");
            window.currentUser = foundUser;
        }
        
        // SUCCESS: Enter App
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        
        startApp();
        
      } catch (err) {
        errorDiv.innerText = err.message || "Failed to connect to database.";
        errorDiv.classList.remove('hidden');
      } finally {
        submitBtn.innerText = isRegisterMode ? 'Register Account' : 'Log In';
        submitBtn.disabled = false;
      }
    };

    async function startApp() {
        // Set lower left profile indicator
        document.getElementById('currentUsernameDisplay').innerText = window.currentUser.username;
        document.getElementById('currentUserInitial').innerText = window.currentUser.username.charAt(0).toUpperCase();
        
        // Show Admin shield if user is Ajgplayz
        if (window.currentUser.username.toLowerCase() === 'ajgplayz') {
            document.getElementById('adminBtn').classList.remove('hidden');
        } else {
            document.getElementById('adminBtn').classList.add('hidden');
        }

        await seedAdminAutomated(); // Check for admin db presence
        listenForUsers(); // Start live sync
    }

    // Ensure Ajgplayz is permanently saved if not present
    async function seedAdminAutomated() {
        try {
            if (!isOfflineMode) {
                const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
                const snapshot = await getDocs(usersRef);
                let adminExists = false;
                snapshot.forEach(doc => {
                    if (doc.data().username.toLowerCase() === 'ajgplayz') adminExists = true;
                });
                
                if (!adminExists) {
                    await addDoc(usersRef, { username: 'Ajgplayz', password: 'IH8People', createdAt: Date.now() });
                }
            } else {
                let users = JSON.parse(localStorage.getItem('ajg_users') || '[]');
                if (!users.find(u => u.username.toLowerCase() === 'ajgplayz')) {
                    users.push({ id: 'user_admin', username: 'Ajgplayz', password: 'IH8People', createdAt: Date.now() });
                    localStorage.setItem('ajg_users', JSON.stringify(users));
                }
            }
        } catch(e) {
            console.warn("Seeding bypassed:", e);
        }
    }

    function listenForUsers() {
        if (!isOfflineMode) {
            // Live Firestore Snapshot
            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
            usersUnsubscribe = onSnapshot(usersRef, (snapshot) => {
                allUsers = [];
                snapshot.forEach(doc => {
                    // Don't show ourselves in DM list
                    if (doc.data().username.toLowerCase() !== window.currentUser.username.toLowerCase()) {
                        allUsers.push({ id: doc.id, ...doc.data() });
                    }
                });
                window.handleUserSearch();
            }, (error) => {
                console.error("Users live sync stopped:", error);
            });
        } else {
            // Local fallback polling loop
            setInterval(() => {
                let users = JSON.parse(localStorage.getItem('ajg_users') || '[]');
                allUsers = users.filter(u => u.username.toLowerCase() !== window.currentUser.username.toLowerCase());
                window.handleUserSearch();
            }, 2000);
            // Initial load
            let users = JSON.parse(localStorage.getItem('ajg_users') || '[]');
            allUsers = users.filter(u => u.username.toLowerCase() !== window.currentUser.username.toLowerCase());
            window.handleUserSearch();
        }
    }

    window.handleUserSearch = function() {
        const inputStr = document.getElementById('userSearchInput').value.toLowerCase();
        const listContainer = document.getElementById('usersList');
        listContainer.innerHTML = '';
        
        let filtered = allUsers;
        
        if (inputStr) {
            filtered = allUsers.filter(u => u.username.toLowerCase().includes(inputStr));
            // Relevance Sort: names STARTING with query go to the top
            filtered.sort((a, b) => {
                const aStart = a.username.toLowerCase().startsWith(inputStr);
                const bStart = b.username.toLowerCase().startsWith(inputStr);
                if (aStart && !bStart) return -1;
                if (!aStart && bStart) return 1;
                return a.username.localeCompare(b.username);
            });
        } else {
             filtered.sort((a, b) => a.username.localeCompare(b.username));
        }

        filtered.forEach(user => {
            let uiName = user.username;
            if (inputStr) {
                // Highlighter logic for search matches
                const regex = new RegExp(`(${inputStr})`, 'gi');
                uiName = uiName.replace(regex, '<span class="text-emerald-400 font-bold bg-gray-700 rounded px-[1px]">$1</span>');
            }

            const div = document.createElement('div');
            // Selection highlight if this is the active chat
            div.className = `flex items-center p-2 rounded-md cursor-pointer transition-colors ${currentChatUserId === user.id ? 'bg-gray-700' : 'hover:bg-gray-700'}`;
            div.onclick = () => openDirectMessage(user);
            
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center mr-3 font-bold text-sm shrink-0 shadow-sm text-white">
                    ${user.username.charAt(0).toUpperCase()}
                </div>
                <div class="truncate text-gray-200 text-sm font-medium">
                    ${uiName}
                </div>
            `;
            listContainer.appendChild(div);
        });
    };

    function getConversationId(userId1, userId2) {
        return [userId1, userId2].sort().join('_');
    }

    function openDirectMessage(user) {
        currentChatUserId = user.id;
        document.getElementById('chatHeaderTitle').innerText = user.username;
        document.getElementById('chatHeaderIcon').classList.remove('hidden');
        document.getElementById('messageForm').classList.remove('hidden');
        document.getElementById('messageInput').focus();
        
        window.handleUserSearch(); // Trigger search re-render to highlight active user block
        listenToMessages(user.id);
    }

    function listenToMessages(targetUserId) {
        if (messagesUnsubscribe) messagesUnsubscribe(); // Clean up old chat listener
        
        const convId = getConversationId(window.currentUser.id, targetUserId);
        
        if (!isOfflineMode) {
            const msgsRef = collection(db, 'artifacts', appId, 'public', 'data', `dms_${convId}`);
            messagesUnsubscribe = onSnapshot(msgsRef, (snapshot) => {
                let msgs = [];
                snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                renderMessagesUi(msgs);
            }, (err) => console.error("Message sync error:", err));
        } else {
            if (window.localMsgInterval) clearInterval(window.localMsgInterval);
            const loadLocal = () => {
                let msgs = JSON.parse(localStorage.getItem(`ajg_dms_${convId}`) || '[]');
                renderMessagesUi(msgs);
            };
            loadLocal();
            window.localMsgInterval = setInterval(loadLocal, 1000);
        }
    }

    function renderMessagesUi(msgs) {
        msgs.sort((a, b) => a.timestamp - b.timestamp);
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        
        if (msgs.length === 0) {
            container.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400">Be the first to say hello!</div>';
            return;
        }

        msgs.forEach(msg => {
            const isMe = msg.senderId === window.currentUser.id;
            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} group`;
            
            div.innerHTML = `
                <div class="max-w-[75%] rounded-lg px-4 py-2 shadow-sm ${isMe ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-gray-800 text-gray-100 rounded-bl-none'}">
                    <div class="text-[11px] font-bold ${isMe ? 'text-emerald-200' : 'text-gray-400'} mb-1">${msg.senderName}</div>
                    <div class="break-words text-sm">${msg.text}</div>
                </div>
            `;
            container.appendChild(div);
        });
        
        container.scrollTop = container.scrollHeight;
    }

    window.handleSendMessage = async function(e) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentChatUserId) return;
        
        input.value = ''; // clear input instantly for UX
        
        const convId = getConversationId(window.currentUser.id, currentChatUserId);
        const msg = {
            senderId: window.currentUser.id,
            senderName: window.currentUser.username,
            text: text,
            timestamp: Date.now()
        };

        if (!isOfflineMode) {
            // Push message to cloud
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', `dms_${convId}`), msg);
            // Track globally for the Admin Panel
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'all_conversations', convId), {
                id: convId,
                lastUpdated: Date.now()
            });
        } else {
            let msgs = JSON.parse(localStorage.getItem(`ajg_dms_${convId}`) || '[]');
            msgs.push({ id: 'msg_' + Date.now(), ...msg });
            localStorage.setItem(`ajg_dms_${convId}`, JSON.stringify(msgs));
            
            let convos = JSON.parse(localStorage.getItem('ajg_all_conversations') || '[]');
            if (!convos.includes(convId)) {
                convos.push(convId);
                localStorage.setItem('ajg_all_conversations', JSON.stringify(convos));
            }
        }
    };

    window.showAdminPanel = async function() {
        document.getElementById('adminPanel').classList.remove('hidden');
        const list = document.getElementById('adminDmList');
        list.innerHTML = '<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><br>Gathering global communications...</div>';
        
        let convos = [];
        if (!isOfflineMode) {
             const convRef = collection(db, 'artifacts', appId, 'public', 'data', 'all_conversations');
             const snap = await getDocs(convRef);
             snap.forEach(doc => convos.push(doc.id));
        } else {
             convos = JSON.parse(localStorage.getItem('ajg_all_conversations') || '[]');
        }

        list.innerHTML = '';
        if (convos.length === 0) {
            list.innerHTML = '<div class="text-gray-400 text-center py-10">Database is empty. No private conversations have been started.</div>';
            return;
        }

        for (let convId of convos) {
             let msgs = [];
             if (!isOfflineMode) {
                 const msgsSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', `dms_${convId}`));
                 msgsSnap.forEach(d => msgs.push({id: d.id, ...d.data()}));
             } else {
                 msgs = JSON.parse(localStorage.getItem(`ajg_dms_${convId}`) || '[]');
             }
             
             if (msgs.length > 0) {
                 msgs.sort((a,b) => a.timestamp - b.timestamp);
                 
                 const box = document.createElement('div');
                 box.className = 'bg-gray-900 border border-gray-700 p-4 rounded-lg mb-4 shadow-lg relative overflow-hidden';
                 
                 let chatHtml = `<div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-3">
                    <div class="font-mono text-xs text-gray-400">ID: ${convId}</div>
                    <button onclick="window.deleteConversation('${convId}')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded font-bold text-xs transition-colors shadow"><i class="fa-solid fa-trash mr-1"></i> Terminate Thread</button>
                 </div>
                 <div class="max-h-60 overflow-y-auto space-y-2 bg-gray-800 p-3 rounded border border-gray-700">`;
                 
                 msgs.forEach(m => {
                     chatHtml += `<div class="text-gray-300 text-sm"><span class="font-bold text-indigo-400">${m.senderName}:</span> ${m.text}</div>`;
                 });
                 
                 chatHtml += '</div>';
                 box.innerHTML = chatHtml;
                 list.appendChild(box);
             }
        }
    };

    window.closeAdminPanel = function() {
        document.getElementById('adminPanel').classList.add('hidden');
    };

    window.deleteConversation = async function(convId) {
        if (!confirm("Are you sure you want to completely erase this conversation history from the database?")) return;
        
        if (!isOfflineMode) {
             const msgsSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', `dms_${convId}`));
             msgsSnap.forEach(async (d) => {
                 await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `dms_${convId}`, d.id));
             });
             await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'all_conversations', convId));
        } else {
             localStorage.removeItem(`ajg_dms_${convId}`);
             let convos = JSON.parse(localStorage.getItem('ajg_all_conversations') || '[]');
             convos = convos.filter(c => c !== convId);
             localStorage.setItem('ajg_all_conversations', JSON.stringify(convos));
        }
        
        window.showAdminPanel(); // Refresh view
    };

    // Logout
    window.logout = function() {
        window.currentUser = null;
        if (usersUnsubscribe) usersUnsubscribe();
        if (messagesUnsubscribe) messagesUnsubscribe();
        document.getElementById('authModal').classList.remove('hidden');
        document.getElementById('appContainer').classList.add('hidden');
        document.getElementById('authPassword').value = '';
        
        // Reset app state
        currentChatUserId = null;
        document.getElementById('messageForm').classList.add('hidden');
        document.getElementById('chatMessages').innerHTML = '';
